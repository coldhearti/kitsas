# .github/workflows/windows-build.yml
#
# Builds the Kitsas desktop app (.exe) for Windows on a GitHub-hosted runner.
#
# CACHING (two layers):
#   1. Qt SDK      -> install-qt-action cache: true
#   2. C++ objects -> sccache writing to a LOCAL directory (SCCACHE_DIR),
#                     persisted across runs by actions/cache@v4.
#
# Why not SCCACHE_GHA_ENABLED: that path uses GitHub's legacy cache API
# (artifactcache.actions.githubusercontent.com), which now returns HTTP 400.
# actions/cache@v4 uses the current cache service, so we persist a plain
# sccache disk cache instead.
#
# How sccache is wired in: qmake does NOT reliably honor a QMAKE_CXX override
# for the MSVC generator (an earlier attempt left sccache with 0 compile
# requests). So instead we SHADOW the compiler: a cl.bat earlier on PATH than
# the real cl.exe. nmake resolves "cl" (and $(CXX)) to cl.bat via PATH, and
# cl.bat calls "sccache <real cl.exe>". The real compiler is invoked by full
# path, so there is no recursion. As belt-and-suspenders we also pass
# QMAKE_CXX/QMAKE_CC=cl.bat; whichever mechanism qmake honors, it ends at cl.bat.
#
# Preprocess-only steps (moc_predefs.h runs the compiler with -E/-P) cannot go
# through sccache, so cl.bat routes those directly to the real cl.exe.
#
# The "Verify cache engaged" step reports whether sccache actually saw compiles.
# It only WARNS (does not fail the build), so a caching hiccup never blocks
# producing the artifact.
#
# Why MSVC: the app links QtWebEngine (Chromium), which on Windows only builds
# with MSVC. WebEngine is prebuilt from the Qt kit; we only link it.

name: Windows build

on:
  push:
    branches: [ master, "feature/**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build commit into versio.h
        shell: bash
        run: |
          sha="$(git rev-parse --short HEAD)"
          sed -i "s/#define KITSAS_BUILD .*/#define KITSAS_BUILD \"$sha\"/" kitsas/versio.h
          echo "Stamped build:"; grep '#define KITSAS_BUILD' kitsas/versio.h

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtpositioning qtwebchannel qtpdf qt5compat'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install sccache binary
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: sccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ github.ref_name }}-
            sccache-${{ runner.os }}-

      - name: Remove unused openjpeg link
        shell: bash
        run: sed -i '/openjpeg-v2.5.0-windows-x64/d' kitsas/kitsas.pro

      - name: Build
        shell: pwsh
        run: |
          # Capture the REAL compiler before shadowing it.
          $real = (Get-Command cl.exe).Source
          if (-not $real) { throw "cl.exe not found; MSVC env not set up" }
          Write-Host "Real cl.exe: $real"

          # cl.bat: route preprocess-only (-E/-P) straight to the real cl,
          # everything else through sccache. Real cl called by full path -> no recursion.
          $wrap = "$env:GITHUB_WORKSPACE\ccwrap"
          New-Item -ItemType Directory -Force -Path $wrap | Out-Null
          $bat = @(
            '@echo off',
            ':scan',
            'if "%~1"=="" goto compile',
            'if /I "%~1"=="-E"  goto raw',
            'if /I "%~1"=="/E"  goto raw',
            'if /I "%~1"=="-EP" goto raw',
            'if /I "%~1"=="/EP" goto raw',
            'if /I "%~1"=="-P"  goto raw',
            'if /I "%~1"=="/P"  goto raw',
            'shift',
            'goto scan',
            ':compile',
            "sccache `"$real`" %*",
            'exit /b %errorlevel%',
            ':raw',
            "`"$real`" %*",
            'exit /b %errorlevel%'
          )
          Set-Content -Path "$wrap\cl.bat" -Value $bat -Encoding Ascii
          Write-Host "---- cl.bat ----"; Get-Content "$wrap\cl.bat"

          # Put the shadow first on PATH for nmake in THIS step only.
          $env:PATH = "$wrap;$env:PATH"

          mkdir build
          cd build
          qmake ..\kitsas\kitsas.pro "CONFIG+=release" "QMAKE_CXX=cl.bat" "QMAKE_CC=cl.bat"
          Write-Host "---- CXX line in generated Makefile ----"
          Select-String -Path Makefile.Release -Pattern '^CXX' | Select-Object -First 1
          nmake
          if (!(Test-Path release\kitsas.exe)) { throw "kitsas.exe was not produced" }

      - name: Verify cache engaged (non-fatal)
        shell: pwsh
        run: |
          $stats = (sccache --show-stats | Out-String)
          Write-Host $stats
          if ($stats -match 'Compile requests\s+(\d+)') {
            $req = [int]$Matches[1]
            if ($req -le 0) {
              Write-Warning "sccache saw 0 compile requests - object caching is NOT engaged (build still valid, just not cached)."
            } else {
              Write-Host "OK: sccache handled $req compile requests."
            }
          } else {
            Write-Warning "Could not parse sccache stats."
          }
          sccache --stop-server | Out-Null

      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          mkdir dist
          copy build\release\kitsas.exe dist\
          windeployqt --release --compiler-runtime dist\kitsas.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitsas-windows
          path: dist
          if-no-files-found: error
