# .github/workflows/windows-build.yml
#
# Builds the Kitsas desktop app (.exe) for Windows on a GitHub-hosted runner.
#
# CACHING (two layers):
#   1. Qt SDK      -> install-qt-action cache: true
#   2. C++ objects -> sccache writing to a LOCAL directory (SCCACHE_DIR),
#                     persisted across runs by actions/cache@v4.
#
# Why not SCCACHE_GHA_ENABLED: that path uses GitHub's legacy cache API, which
# now returns HTTP 400. actions/cache@v4 uses the current service, so we persist
# a plain sccache disk cache instead.
#
# How sccache is wired in: neither a QMAKE_CXX override nor a PATH shadow made
# qmake's MSVC build call the wrapper (sccache kept seeing 0 compile requests),
# because qmake bakes the compiler into the generated Makefile. So we let qmake
# generate normally, then REWRITE the CXX/CC macro in Makefile.Release to point
# at cl.bat. cl.bat calls "sccache <real cl.exe>" (real compiler by full path ->
# no recursion); preprocess-only steps (-E/-P, e.g. moc_predefs) go straight to
# the real cl since sccache can't cache them.
#
# The "Verify cache engaged" step only reports (never fails the build) so a
# caching hiccup can't block producing the artifact.
#
# Why MSVC: the app links QtWebEngine (Chromium), which on Windows only builds
# with MSVC. WebEngine is prebuilt from the Qt kit; we only link it.

name: Windows build

on:
  push:
    branches: [ master, "feature/**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build commit into versio.h
        shell: bash
        run: |
          sha="$(git rev-parse --short HEAD)"
          sed -i "s/#define KITSAS_BUILD .*/#define KITSAS_BUILD \"$sha\"/" kitsas/versio.h
          echo "Stamped build:"; grep '#define KITSAS_BUILD' kitsas/versio.h

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtpositioning qtwebchannel qtpdf qt5compat'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install sccache binary
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: sccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ github.ref_name }}-
            sccache-${{ runner.os }}-

      - name: Remove unused openjpeg link
        shell: bash
        run: sed -i '/openjpeg-v2.5.0-windows-x64/d' kitsas/kitsas.pro

      - name: Build
        shell: pwsh
        run: |
          $real = (Get-Command cl.exe).Source
          if (-not $real) { throw "cl.exe not found; MSVC env not set up" }
          Write-Host "Real cl.exe: $real"

          # cl.bat: preprocess-only (-E/-P) -> real cl; everything else -> sccache.
          # Real cl invoked by full path, so no recursion.
          $wrap = "$env:GITHUB_WORKSPACE\ccwrap"
          New-Item -ItemType Directory -Force -Path $wrap | Out-Null
          $bat = @(
            '@echo off',
            ':scan',
            'if "%~1"=="" goto compile',
            'if /I "%~1"=="-E"  goto raw',
            'if /I "%~1"=="/E"  goto raw',
            'if /I "%~1"=="-EP" goto raw',
            'if /I "%~1"=="/EP" goto raw',
            'if /I "%~1"=="-P"  goto raw',
            'if /I "%~1"=="/P"  goto raw',
            'shift',
            'goto scan',
            ':compile',
            "sccache `"$real`" %*",
            'exit /b %errorlevel%',
            ':raw',
            "`"$real`" %*",
            'exit /b %errorlevel%'
          )
          Set-Content -Path "$wrap\cl.bat" -Value $bat -Encoding Ascii
          $clbat = "$wrap\cl.bat"
          Write-Host "Wrapper: $clbat"

          mkdir build
          cd build
          qmake ..\kitsas\kitsas.pro "CONFIG+=release"

          # Force the wrapper into the generated makefile(s), regardless of how
          # qmake spelled the compiler. This is what actually engages sccache.
          foreach ($mk in @("Makefile", "Makefile.Release")) {
            if (Test-Path $mk) {
              Write-Host "---- $mk CXX/CC before ----"
              Select-String -Path $mk -Pattern '^(CXX|CC)\s*=' | ForEach-Object { $_.Line }
              (Get-Content $mk) `
                -replace '^(CXX\s*=\s*).*$', ('${1}' + $clbat) `
                -replace '^(CC\s*=\s*).*$',  ('${1}' + $clbat) `
                | Set-Content $mk
              Write-Host "---- $mk CXX/CC after ----"
              Select-String -Path $mk -Pattern '^(CXX|CC)\s*=' | ForEach-Object { $_.Line }
            }
          }

          nmake
          if (!(Test-Path release\kitsas.exe)) { throw "kitsas.exe was not produced" }

      - name: Verify cache engaged (non-fatal)
        shell: pwsh
        run: |
          $stats = ""
          try { $stats = (sccache --show-stats 2>&1 | Out-String) } catch { }
          Write-Host $stats
          if ($stats -match 'Compile requests\s+(\d+)') {
            $req = [int]$Matches[1]
            if ($req -le 0) {
              Write-Warning "sccache saw 0 compile requests - object caching is NOT engaged (build still valid, just not cached)."
            } else {
              Write-Host "OK: sccache handled $req compile requests."
            }
          } else {
            Write-Warning "Could not parse sccache stats."
          }
          try { sccache --stop-server 2>&1 | Out-Null } catch { }
          exit 0

      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          mkdir dist
          copy build\release\kitsas.exe dist\
          windeployqt --release --compiler-runtime dist\kitsas.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitsas-windows
          path: dist
          if-no-files-found: error
