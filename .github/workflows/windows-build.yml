# .github/workflows/windows-build.yml
#
# Builds the Kitsas desktop app (.exe) for Windows on a GitHub-hosted runner.
#
# CACHING (two layers):
#   1. Qt SDK      -> install-qt-action cache: true
#   2. C++ objects -> sccache compiler cache in the GitHub Actions cache.
#
# Why the wrapper: qmake uses $(CXX) for BOTH real compiles AND the
# moc_predefs.h step, which runs "cl -E" (preprocess only). sccache cannot
# handle -E and errors out (return code 0x2). So QMAKE_CXX/CC point at a small
# wrapper that routes -E straight to cl and sends everything else to sccache.
#
# Why MSVC: the app links QtWebEngine (Chromium), which on Windows only builds
# with MSVC. WebEngine is prebuilt from the Qt kit; we only link it.

name: Windows build

on:
  push:
    branches: [ master, "feature/**" ]
  workflow_dispatch: {}

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtpositioning qtwebchannel qtpdf qt5compat'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      # Compiler wrapper. Built line-by-line (no here-string indentation), each
      # line written flush-left with CRLF so the .bat is valid. It scans the
      # args token-by-token: if it sees -E / /E (the moc_predefs preprocess
      # step) it calls plain cl; otherwise it routes through sccache. Scanning
      # per-token (not a whole-string match) means quoted paths and the "(x86)"
      # in the Windows SDK include dirs can't break detection.
      - name: Create sccache compiler wrapper
        shell: pwsh
        run: |
          $lines = @(
            '@echo off',
            ':scan',
            'if "%~1"=="" goto compile',
            'if /I "%~1"=="-E" goto raw',
            'if /I "%~1"=="/E" goto raw',
            'shift',
            'goto scan',
            ':compile',
            'sccache cl %*',
            'exit /b %errorlevel%',
            ':raw',
            'cl %*',
            'exit /b %errorlevel%'
          )
          Set-Content -Path "$env:GITHUB_WORKSPACE\cl-cache.bat" -Value $lines -Encoding Ascii
          Write-Host "---- cl-cache.bat ----"
          Get-Content "$env:GITHUB_WORKSPACE\cl-cache.bat"

      - name: Remove unused openjpeg link
        shell: bash
        run: sed -i '/openjpeg-v2.5.0-windows-x64/d' kitsas/kitsas.pro

      - name: Build
        shell: pwsh
        run: |
          $wrapper = "$env:GITHUB_WORKSPACE\cl-cache.bat"
          mkdir build
          cd build
          qmake ..\kitsas\kitsas.pro "CONFIG+=release" "QMAKE_CXX=$wrapper" "QMAKE_CC=$wrapper"
          Write-Host "---- CXX line in generated Makefile ----"
          Select-String -Path Makefile.Release -Pattern '^CXX' | Select-Object -First 1
          nmake
          if (!(Test-Path release\kitsas.exe)) { throw "kitsas.exe was not produced" }

      - name: sccache stats
        shell: pwsh
        run: sccache --show-stats

      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          mkdir dist
          copy build\release\kitsas.exe dist\
          windeployqt --release --compiler-runtime dist\kitsas.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitsas-windows
          path: dist
          if-no-files-found: error
