# .github/workflows/windows-build.yml
#
# Builds the Kitsas desktop app (.exe) for Windows on a GitHub-hosted runner.
#
# WHY MSVC: the app links QtWebEngine (Chromium), which on Windows only builds
# with MSVC — never MinGW. So this uses the Qt "win64_msvc2022_64" kit and the
# Visual Studio toolchain that ships on the windows-latest runner.
#
# The Qt WebEngine module here is PREBUILT (from the official Qt kit); we only
# link it, we don't compile Chromium — so the build is normal-speed, not hours.
#
# Output: a zipped, self-contained "kitsas-windows" folder (exe + all Qt DLLs
# + QtWebEngineProcess + resources), downloadable from the run's Artifacts.

name: Windows build

on:
  push:
    branches: [ master, "feature/**" ]
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs Qt 6.9.3 for MSVC with the add-on modules Kitsas needs.
      # Base install already provides qtbase (widgets/sql/network/printsupport/
      # xml), qtsvg and qtdeclarative(Quick, a WebEngine dep). The -modules are
      # the extras: WebEngine + its positioning/webchannel deps, PDF, 5Compat.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtpositioning qtwebchannel qtpdf qt5compat'
          cache: true

      # Puts cl.exe / nmake and the MSVC environment on PATH for later steps.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # openjpeg is referenced only in kitsas.pro's windows{} LIBS and nowhere
      # in the code (leftover from the old poppler PDF path). Drop the 3 lines
      # so the linker doesn't demand a lib we don't use. Leaves -lbcrypt intact.
      - name: Remove unused openjpeg link
        shell: bash
        run: sed -i '/openjpeg-v2.5.0-windows-x64/d' kitsas/kitsas.pro

      - name: Build
        shell: pwsh
        run: |
          mkdir build
          cd build
          qmake ..\kitsas\kitsas.pro "CONFIG+=release"
          nmake
          if (!(Test-Path release\kitsas.exe)) { throw "kitsas.exe was not produced" }

      # windeployqt copies every Qt DLL the exe needs, plus the WebEngine
      # runtime (QtWebEngineProcess.exe + resources + locales), into dist\.
      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          mkdir dist
          copy build\release\kitsas.exe dist\
          windeployqt --release --compiler-runtime dist\kitsas.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitsas-windows
          path: dist
          if-no-files-found: error
