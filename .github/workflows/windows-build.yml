# .github/workflows/windows-build.yml
#
# Builds the Kitsas desktop app (.exe) for Windows on a GitHub-hosted runner.
#
# CACHING (two layers):
#   1. Qt SDK        -> install-qt-action cache: true  (already had this)
#   2. C++ objects   -> sccache compiler cache, stored in the GitHub Actions
#                       cache. Unchanged .cpp files are served from cache, so
#                       after the first run a one-file change rebuilds ~one file
#                       instead of the whole app.
#
# WHY MSVC: the app links QtWebEngine (Chromium), which on Windows only builds
# with MSVC. WebEngine here is prebuilt from the Qt kit; we only link it.

name: Windows build

on:
  push:
    branches: [ master, "feature/**" ]
  workflow_dispatch: {}

env:
  # Tell sccache to use the GitHub Actions cache as its backend.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtpositioning qtwebchannel qtpdf qt5compat'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Installs sccache and points it at the GitHub Actions cache backend.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Remove unused openjpeg link
        shell: bash
        run: sed -i '/openjpeg-v2.5.0-windows-x64/d' kitsas/kitsas.pro

      - name: Build
        shell: pwsh
        run: |
          mkdir build
          cd build
          # Route every compile through sccache. CONFIG+=release keeps MSVC from
          # emitting a separate .pdb (/Zi), which is what would otherwise defeat
          # object caching.
          qmake ..\kitsas\kitsas.pro "CONFIG+=release" `
                QMAKE_CXX="sccache cl" QMAKE_CC="sccache cl"
          nmake
          if (!(Test-Path release\kitsas.exe)) { throw "kitsas.exe was not produced" }

      # Cache-hit rate for this run - watch "Cache hits" climb on repeat builds.
      - name: sccache stats
        shell: pwsh
        run: sccache --show-stats

      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          mkdir dist
          copy build\release\kitsas.exe dist\
          windeployqt --release --compiler-runtime dist\kitsas.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitsas-windows
          path: dist
          if-no-files-found: error
