# .github/workflows/windows-build.yml
#
# Builds the Kitsas desktop app (.exe) for Windows on a GitHub-hosted runner.
#
# CACHING (two layers):
#   1. Qt SDK      -> install-qt-action cache: true
#   2. C++ objects -> sccache writing to a LOCAL directory (SCCACHE_DIR),
#                     persisted across runs by actions/cache@v4.
#
# Why not SCCACHE_GHA_ENABLED: that path uses GitHub's legacy cache API
# (artifactcache.actions.githubusercontent.com), which now returns HTTP 400.
# actions/cache@v4 uses the current cache service, so we let it persist a plain
# sccache disk cache instead.
#
# Why the wrapper: qmake uses $(CXX) for BOTH real compiles AND the
# moc_predefs.h step, which runs "cl -E" (preprocess only). sccache cannot
# handle preprocess-only invocations. cl-cache.bat routes -E/-P to plain cl and
# everything else to "sccache cl".
#
# IMPORTANT: the wrapper is referenced by BARE NAME (cl-cache.bat) via PATH, not
# by absolute path. qmake mangles backslashes in QMAKE_CXX=<path>, which silently
# drops the override and falls back to plain cl (sccache then records 0 compile
# requests). The "Verify cache engaged" step fails the build if that happens.
#
# Why MSVC: the app links QtWebEngine (Chromium), which on Windows only builds
# with MSVC. WebEngine is prebuilt from the Qt kit; we only link it.

name: Windows build

on:
  push:
    branches: [ master, "feature/**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build commit into versio.h
        shell: bash
        run: |
          sha="$(git rev-parse --short HEAD)"
          sed -i "s/#define KITSAS_BUILD .*/#define KITSAS_BUILD \"$sha\"/" kitsas/versio.h
          echo "Stamped build:"; grep '#define KITSAS_BUILD' kitsas/versio.h

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtpositioning qtwebchannel qtpdf qt5compat'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install sccache binary
        uses: mozilla-actions/sccache-action@v0.0.6

      # Persist sccache's on-disk cache with the CURRENT cache API. New sha each
      # push misses the exact key but restores the newest matching prefix, then
      # saves a fresh entry at job end.
      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: sccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ github.ref_name }}-
            sccache-${{ runner.os }}-

      - name: Create sccache compiler wrapper (on PATH)
        shell: pwsh
        run: |
          $dir = "$env:GITHUB_WORKSPACE\ccwrap"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $lines = @(
            '@echo off',
            'setlocal',
            ':scan',
            'if "%~1"=="" goto compile',
            'if /I "%~1"=="-E"  goto raw',
            'if /I "%~1"=="/E"  goto raw',
            'if /I "%~1"=="-EP" goto raw',
            'if /I "%~1"=="/EP" goto raw',
            'if /I "%~1"=="-P"  goto raw',
            'if /I "%~1"=="/P"  goto raw',
            'shift',
            'goto scan',
            ':compile',
            'sccache cl %*',
            'exit /b %errorlevel%',
            ':raw',
            'cl %*',
            'exit /b %errorlevel%'
          )
          Set-Content -Path "$dir\cl-cache.bat" -Value $lines -Encoding Ascii
          # Put the wrapper dir on PATH for subsequent steps so qmake can
          # reference it by bare name (no backslash path for qmake to mangle).
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "---- cl-cache.bat ----"
          Get-Content "$dir\cl-cache.bat"

      - name: Remove unused openjpeg link
        shell: bash
        run: sed -i '/openjpeg-v2.5.0-windows-x64/d' kitsas/kitsas.pro

      - name: Build
        shell: pwsh
        run: |
          Write-Host "cl-cache.bat resolves to: $((Get-Command cl-cache.bat).Source)"
          Write-Host "sccache resolves to:      $((Get-Command sccache).Source)"
          mkdir build
          cd build
          # Bare name (not an absolute path) so qmake doesn't mangle backslashes.
          qmake ..\kitsas\kitsas.pro "CONFIG+=release" "QMAKE_CXX=cl-cache.bat" "QMAKE_CC=cl-cache.bat"
          Write-Host "---- CXX line in generated Makefile ----"
          Select-String -Path Makefile.Release -Pattern '^CXX' | Select-Object -First 1
          nmake
          if (!(Test-Path release\kitsas.exe)) { throw "kitsas.exe was not produced" }

      - name: Verify cache engaged
        shell: pwsh
        run: |
          $stats = (sccache --show-stats | Out-String)
          Write-Host $stats
          if ($stats -match 'Compile requests\s+(\d+)') {
            $req = [int]$Matches[1]
            Write-Host "Parsed compile requests: $req"
            if ($req -le 0) {
              throw "sccache recorded 0 compile requests: the cl-cache wrapper was NOT used, so object caching is doing nothing. Failing so this does not regress silently."
            }
          } else {
            Write-Warning "Could not parse sccache stats; skipping cache self-check."
          }
          # Flush the server so the on-disk cache is fully written before actions/cache saves it.
          sccache --stop-server | Out-Null

      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          mkdir dist
          copy build\release\kitsas.exe dist\
          windeployqt --release --compiler-runtime dist\kitsas.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitsas-windows
          path: dist
          if-no-files-found: error
